var TB=[{"s":"She _____ for the SSC exam since January.","ans":"has been preparing","ops":["prepares","prepared","has been preparing","is preparing"],"tense":"Present Perfect Continuous","exp":"The signal word 'since January' shows an action that started in the past and continues now → has/have been + V-ing."},{"s":"The train _____ before we reached the station.","ans":"had left","ops":["left","has left","had left","was leaving"],"tense":"Past Perfect","exp":"When two past actions occur, the earlier action uses Past Perfect (had + V3), while the later uses Simple Past ('reached')."},{"s":"Look! The children _____ in the rain right now.","ans":"are playing","ops":["play","are playing","played","have played"],"tense":"Present Continuous","exp":"'Look!' and 'right now' indicate an action happening at the moment of speaking → is/am/are + V-ing."},{"s":"We _____ the museum yesterday afternoon.","ans":"visited","ops":["visit","have visited","visited","had visited"],"tense":"Simple Past","exp":"'Yesterday' marks a finished past time. Never use Present Perfect with definite past time markers → Simple Past (V2)."},{"s":"By next Friday, they _____ the entire syllabus.","ans":"will have completed","ops":["will complete","will have completed","completed","are completing"],"tense":"Future Perfect","exp":"'By next Friday' signals completion before a future deadline → will have + V3."},{"s":"The sun _____ in the east.","ans":"rises","ops":["is rising","rose","rises","has risen"],"tense":"Simple Present","exp":"Universal truths and scientific facts always use Simple Present (V1 + s/es for singular subjects)."},{"s":"While I _____ dinner, the lights suddenly went out.","ans":"was cooking","ops":["cooked","was cooking","had cooked","am cooking"],"tense":"Past Continuous","exp":"'While' introduces an ongoing background action interrupted by a short Simple Past action ('went out') → was/were + V-ing."},{"s":"He _____ already _____ his assignment.","ans":"has / submitted","ops":["has / submitted","did / submit","is / submitting","will / submit"],"tense":"Present Perfect","exp":"The signal word 'already' with present relevance takes Present Perfect → has/have + V3."},{"s":"At 8 pm tomorrow, she _____ a live seminar.","ans":"will be attending","ops":["attends","will be attending","has attended","attended"],"tense":"Future Continuous","exp":"'At 8 pm tomorrow' refers to an action in progress at a specific future moment → will be + V-ing."},{"s":"Did he _____ the truth to the committee?","ans":"speak","ops":["spoke","spoken","speak","speaks"],"tense":"Simple Past (Interrogative)","exp":"Classic SSC trap: after 'did', always use the base form of the verb (V1), never V2."},{"s":"By the time the doctor arrived, the patient _____.","ans":"had recovered","ops":["recovered","had recovered","has recovered","recovers"],"tense":"Past Perfect","exp":"'By the time + Simple Past' pairs with Past Perfect (had + V3) for the action completed earlier."},{"s":"They _____ in Delhi for five years before they moved to Pune.","ans":"had been living","ops":["have been living","had been living","lived","are living"],"tense":"Past Perfect Continuous","exp":"Duration ('for five years') continuing up to a past event ('before they moved') → had been + V-ing."},{"s":"Rohan usually _____ to work by metro.","ans":"goes","ops":["go","goes","is going","went"],"tense":"Simple Present","exp":"'Usually' indicates a regular habit; singular subject 'Rohan' takes V1 + es ('goes')."},{"s":"By 2028, she _____ at this institute for ten years.","ans":"will have been teaching","ops":["will teach","will be teaching","will have been teaching","teaches"],"tense":"Future Perfect Continuous","exp":"'By 2028' + duration ('for ten years') takes Future Perfect Continuous → will have been + V-ing."},{"s":"Have you ever _____ a classical song on stage?","ans":"sung","ops":["sing","sang","sung","singing"],"tense":"Present Perfect","exp":"'Have + ever' requires the past participle (V3) → sing / sang / sung."},{"s":"She has not _____ to me since last Monday.","ans":"spoken","ops":["speak","spoke","spoken","speaking"],"tense":"Present Perfect","exp":"After 'has/have', always use V3 ('spoken'). 'Since last Monday' connects past to present."}];
var SUBJECTS = ["I", "You", "He/She", "We", "They"];
var isThirdSing = s => s === "He/She" || s === "He";
var auxBe = s => s === "I" ? "am" : isThirdSing(s) ? "is" : "are";
var auxWas = s => (s === "I" || isThirdSing(s)) ? "was" : "were";
var auxHave = s => isThirdSing(s) ? "has" : "have";
var auxWill = s => (s === "I" || s === "We") ? "shall / will" : "will";

function conjugate(tenseIdx, subj, v) {
  switch (tenseIdx) {
    case 0: return isThirdSing(subj) ? v.vs : v.v1;
    case 1: return `${auxBe(subj)} ${v.ving}`;
    case 2: return `${auxHave(subj)} ${v.v3}`;
    case 3: return `${auxHave(subj)} been ${v.ving}`;
    case 4: return v.v2;
    case 5: return `${auxWas(subj)} ${v.ving}`;
    case 6: return `had ${v.v3}`;
    case 7: return `had been ${v.ving}`;
    case 8: return `${auxWill(subj)} ${v.v1}`;
    case 9: return `${auxWill(subj)} be ${v.ving}`;
    case 10: return `${auxWill(subj)} have ${v.v3}`;
    case 11: return `${auxWill(subj)} have been ${v.ving}`;
    default: return v.v1;
  }
}

function getStructures(tenseIdx, v) {
  var o = v.obj;
  var d = v.dur;
  switch (tenseIdx) {
    case 0: return { pos: `He ${v.vs} ${o}.`, neg: `He does not ${v.v1} ${o}.`, q: `Does he ${v.v1} ${o}?` };
    case 1: return { pos: `He is ${v.ving} ${o}.`, neg: `He is not ${v.ving} ${o}.`, q: `Is he ${v.ving} ${o}?` };
    case 2: return { pos: `He has ${v.v3} ${o}.`, neg: `He has not ${v.v3} ${o}.`, q: `Has he ${v.v3} ${o}?` };
    case 3: return { pos: `He has been ${v.ving} ${o} ${d}.`, neg: `He has not been ${v.ving} ${o} ${d}.`, q: `Has he been ${v.ving} ${o} ${d}?` };
    case 4: return { pos: `He ${v.v2} ${o}.`, neg: `He did not ${v.v1} ${o}.`, q: `Did he ${v.v1} ${o}?` };
    case 5: return { pos: `He was ${v.ving} ${o}.`, neg: `He was not ${v.ving} ${o}.`, q: `Was he ${v.ving} ${o}?` };
    case 6: return { pos: `He had ${v.v3} ${o}.`, neg: `He had not ${v.v3} ${o}.`, q: `Had he ${v.v3} ${o}?` };
    case 7: return { pos: `He had been ${v.ving} ${o} ${d}.`, neg: `He had not been ${v.ving} ${o} ${d}.`, q: `Had he been ${v.ving} ${o} ${d}?` };
    case 8: return { pos: `He will ${v.v1} ${o}.`, neg: `He will not ${v.v1} ${o}.`, q: `Will he ${v.v1} ${o}?` };
    case 9: return { pos: `He will be ${v.ving} ${o}.`, neg: `He will not be ${v.ving} ${o}.`, q: `Will he be ${v.ving} ${o}?` };
    case 10: return { pos: `He will have ${v.v3} ${o}.`, neg: `He will not have ${v.v3} ${o}.`, q: `Will he have ${v.v3} ${o}?` };
    case 11: return { pos: `He will have been ${v.ving} ${o} ${d}.`, neg: `He will not have been ${v.ving} ${o} ${d}.`, q: `Will he have been ${v.ving} ${o} ${d}?` };
  }
}

var SE=["Neither of the boys|have completed|their homework|before the bell rang.|1|Neither takes a singular verb: has completed.","She is|senior than|me by|two years.|1|Senior/junior take ‘to’: senior to me.","He prefers|tea than coffee|in the|morning.|1|Prefer is followed by ‘to’: tea to coffee.","The news|are very|shocking for|all of us.|1|News is singular: is very shocking.","I have been|living here|since five years|and I like it.|2|Use ‘for’ with a period: for five years.","Each of the students|have received|a certificate|from the principal.|1|Each takes a singular verb: has received.","Hardly had he|reached the station|than the train|left.|2|Hardly is followed by ‘when’: when the train left.","He did not|knew the|answer to|the question.|1|After ‘did not’ use V1: did not know.","Many a student|have failed|in this|difficult exam.|1|Many a + singular noun takes a singular verb: has failed.","One of my friends|are studying|medicine in|Delhi.|1|‘One of’ takes a singular verb: is studying.","The teacher as well as|the students|were present|in the hall.|2|The verb agrees with the first subject: was present.","I am|looking forward|to meet|you soon.|2|Look forward to + V-ing: to meeting.","She suggested me|to take|rest for|a few days.|0|Say ‘suggested that I take rest’, not ‘suggested me to’.","Though he was poor,|but he|never begged|for help.|1|Do not use ‘though’ and ‘but’ together: remove ‘but’.","Mathematics|are a|difficult subject|for many students.|1|Mathematics is singular: is a difficult subject.","He gave me|an advice|about my|career.|1|Advice is uncountable: some advice / a piece of advice.","I saw|a ten years old|boy playing|in the park.|1|Use singular in a compound adjective: a ten-year-old boy.","She is good|in English|and very|fond of music.|1|Good at is correct: good at English.","The furniture|in this room|are very|expensive.|2|Furniture is uncountable and singular: is very expensive.","If I was|you, I would|not go|there.|0|In an unreal condition use ‘were’: If I were you.","He said me|that he|would come|tomorrow.|0|Use ‘told me’, because say is not followed by an object.","Please do not|disturb him,|he is|sleeping now.|4|No error.","Rohan is|taller than|any other boy|in his class.|4|No error.","By the time we reached,|the show|had already|started.|4|No error.","He is|one of the|best player|in the team.|2|One of the + plural noun: best players.","I have bought|a new|furnitures|for my house.|2|Furniture has no plural: furniture.","She does not|has any|brother or|sister.|1|After ‘does not’ use V1: have any.","The thief ran|away when|he saw|a police.|3|Say ‘the police’ or ‘a policeman’.","Either you|or he|are responsible|for this.|2|The verb agrees with the nearer subject: is responsible.","The lion is|more stronger|than the|tiger.|1|Do not use ‘more’ with ‘-er’: stronger.","Not only he|but also his sister|were late|for school.|2|The verb agrees with the nearer subject: was late.","I will call|you when|she will|arrive.|2|No future tense in a time clause: when she arrives.","The boy|who was punished|by the teacher|were my cousin.|3|The subject is ‘boy’ (singular): was my cousin.","He has|been working|here from|2015.|2|Use ‘since’ with a point in time: since 2015.","Do you know|where does|he live|these days?|1|Indirect question: where he lives.","She sings|very well|and dances|beautiful.|3|Use an adverb: beautifully.","My brother|is working|in a bank|since last year.|1|Use present perfect continuous: has been working.","No sooner did he|reach the station|when the train|left.|2|No sooner is followed by ‘than’: than the train left.","The police|has arrested|the thief|last night.|1|Police is plural and ‘last night’ needs past: arrested.","Honesty is|the best|policy in|every situation.|4|No error.","He has been|waiting for|you since|morning.|4|No error."].map(function(x){return x.split("|")});
